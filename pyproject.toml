deps = [
    "pytest>=7",
    "nbmake",
    "brightway2",
    "pypardiso; platform_machine == 'x86_64'",
]

[tool.tox.env."py312-bw25"]
base_python = "3.12"
deps = [
    "pytest>=7",
    "nbmake",
    "brightway25",
    "pypardiso; platform_machine == 'x86_64'",
]

[tool.tox.env."py313-bw2"]
base_python = "3.13"
deps = [
