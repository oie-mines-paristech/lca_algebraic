name: tests

on:
  push:
    branches:
      - main
      - dev
      - unified
  pull_request:
    branches:
      - main
      - dev
      - unified

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            tox-env: py310-bw2
          - python-version: "3.10"
            tox-env: py310-bw25
          - python-version: "3.11"
            tox-env: py311-bw2
          - python-version: "3.11"
            tox-env: py311-bw25
          - python-version: "3.12"
            tox-env: py312-bw2
          - python-version: "3.12"
            tox-env: py312-bw25
          - python-version: "3.13"
            tox-env: py313-bw2
          - python-version: "3.13"
            tox-env: py313-bw25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.tox-env }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache tox environments
        uses: actions/cache@v6
        with:
          path: .tox
          key: tox-${{ runner.os }}-${{ matrix.tox-env }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            tox-${{ runner.os }}-${{ matrix.tox-env }}-

      - name: Run tox
        run: uvx tox -e ${{ matrix.tox-env }}
